<!DOCTYPE html>
<html>
<head>
    <title>All Posts</title>
</head>
<body>

    <h1>All Blog Posts</h1>

    <!-- Search bar -->
    <form method="get" action="{% url 'post-search' %}">
        <input type="text" name="q" placeholder="ابحث في البوستات..." value="{{ request.GET.q }}">
        <button type="submit">Search</button>
    </form>

    <a href="{% url 'post-create' %}">+ Create New Post</a>

    <hr>

    {% for post in posts %}
        <h2><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.content|truncatechars:150 }}</p>

        <!-- Tags section -->
        {% if post.tags.all %}
            <p>
                Tags:
                {% for tag in post.tags.all %}
                    <a href="{% url 'posts-by-tag' tag.name %}">#{{ tag.name }}</a>
                    {% if not forloop.last %}, {% endif %}
                {% endfor %}
            </p>
        {% endif %}

        <hr>
    {% empty %}
        <p>No posts found.</p>
    {% endfor %}

</body>
</html>
