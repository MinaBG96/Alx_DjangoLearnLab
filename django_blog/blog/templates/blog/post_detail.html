<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
</head>
<body>
    <a href="{% url 'post-list' %}">← Back to all posts</a>

    <h1>{{ post.title }}</h1>
    <p>By {{ post.author }} - {{ post.created_at|date:"Y-m-d H:i" }}</p>
    <p>{{ post.content }}</p>

    {% if user == post.author %}
        <a href="{% url 'post-edit' post.pk %}">Edit</a> |
        <a href="{% url 'post-delete' post.pk %}">Delete</a>
    {% endif %}
</body>
</html>
